_ > nanoagent.plugin.manifest.ManifestConfig:
id: formula-validity
name: Formula Validity
version: 0.1.0
status: ready
spec: nanoagent.plugin/v0001

runtime > nanoagent.plugin.manifest.RuntimeConfig:
  type: mcp_stdio
  command: [uv, run, --frozen, python, -m, plugin]

permissions > nanoagent.plugin.manifest.PermissionsConfig:
  network > nanoagent.plugin.manifest.NetworkConfig:
    hosts: []
  filesystem > nanoagent.plugin.manifest.FilesystemConfig:
    write: [workspace]

# One entry per contract.Tool; its input and output classes are contract.TOOLS's.
tools > dict[contract.Tool, nanoagent.plugin.manifest.ToolConfig]:
  submit:
    description: Submit a yes/no answer for a formula-validity question and receive the verdict

# One entry per contract.Task; its input class is contract.TASKS's.
tasks > dict[contract.Task, nanoagent.plugin.manifest.TaskConfig]:
  formula-validity:
    description: >-
      Decide whether a given expression is a legal propositional formula under the strict
      fully-parenthesized grammar — every compound formula must be wrapped in its own
      parentheses, e.g. (A∧B) is legal but A∧B and (A∧B)∨C are not
    runner: agent
    tools: [submit]
    reference: null
    instructions: |-
      You are given an expression. Decide whether it is a legal propositional formula
      under the strict fully-parenthesized grammar:

        formula ::= var | (¬ formula) | (formula ∨ formula) | (formula ∧ formula)
                  | (formula → formula) | (formula ↔ formula)
        var     ::= any alphanumeric identifier starting with a letter

      Every compound formula must be fully parenthesized. A single variable (e.g. A, x1)
      is legal. (A∧B) is legal. (A∧B)∨C is not — the outer ∨ is not parenthesized.

      Call submit with the expression exactly as given and your answer ("yes" or "no").
